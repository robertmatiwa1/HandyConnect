<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Notification Health</title><style>:root{--ink:#10221b;--muted:#657970;--green:#126b49;--bg:#f3f6f5;--line:#dfe8e4;--red:#a83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:800;color:var(--green);font-size:20px}.wrap{max-width:1400px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat,.box,.login{background:#fff;border:1px solid var(--line);border-radius:15px}.stat{padding:16px}.n{font-size:28px;font-weight:800}.muted{color:var(--muted)}.box{overflow:hidden;margin-bottom:16px}.boxhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #edf2f0;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fbfcfc}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#edf4f1}.pill.sent{background:#e4f5ec;color:#17623f}.pill.pending,.pill.processing{background:#fff3d6;color:#7c5200}.pill.dead_letter{background:#fde8e8;color:#8f2f2f}button,a.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.danger{color:var(--red)}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,92vw);padding:30px}.login input{width:100%;padding:13px;border:1px solid #cbd9d3;border-radius:11px;font-size:16px}.login button{width:100%;margin-top:13px;padding:13px}.hidden{display:none!important}.error{background:#fde8e8;color:#852f2f;padding:12px;border-radius:12px;margin:12px 0;display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}</style></head><body><section id="loginWrap" class="loginwrap"><form id="loginForm" class="login"><div class="brand">HandyConnect · Notification Health</div><p class="muted">Operations-only messaging controls</p><div id="loginError" class="error"></div><input id="password" type="password" placeholder="Admin password" required autofocus><button class="primary">Sign in</button></form></section><section id="app" class="hidden"><header class="top"><div class="brand">HandyConnect · Notification Health</div><div><a class="btn" href="../">Back to Ops</a> <button id="signout">Sign out</button></div></header><main class="wrap"><div style="display:flex;justify-content:space-between;gap:12px;align-items:end"><div><h1 style="margin:0">WhatsApp delivery health</h1><div id="updated" class="muted">Loading…</div></div><button class="primary" onclick="load()">Refresh</button></div><div id="error" class="error"></div><section id="stats" class="stats"></section><section id="recent"></section><section id="audit"></section></main></section><script>const API='https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/notification-admin';let pw=sessionStorage.getItem('hc_admin_password')||'';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const D=s=>s?new Date(s).toLocaleString():'—';const P=s=>'<span class="pill '+E(s)+'">'+E(String(s).replaceAll('_',' '))+'</span>';async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify(body)}),x=await r.json().catch(()=>({error:'Invalid response'}));if(r.status===401)throw Error('Invalid admin password');if(!r.ok)throw Error(x.error||'Request failed');return x}function box(title,headers,rows){return '<div class="box"><div class="boxhead"><strong>'+E(title)+'</strong><span class="muted">'+rows.length+' shown</span></div>'+(rows.length?'<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+E(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div style="padding:28px;text-align:center" class="muted">Nothing to show.</div>')+'</div>'}async function retry(id){const reason=prompt('Reason for retry:','Confirmed legitimate notification; retry requested by Ops');if(reason===null)return;if(!confirm('Requeue this dead-letter notification for WhatsApp delivery?'))return;await api({action:'retry',id,reason});await load()}function render(x){const c=x.counts||{};stats.innerHTML=[['Pending',c.pending||0],['Processing / retrying',c.processing||0],['Sent',c.sent||0],['Dead-letter',c.dead_letter||0]].map(a=>'<div class="stat"><div class="n">'+E(a[1])+'</div><div class="muted">'+E(a[0])+'</div></div>').join('');recent.innerHTML=box('Recent notifications',['Recipient','Kind','Status','Attempts','Last error','Next / sent','Action'],(x.recent||[]).map(n=>'<tr><td>'+E(n.recipient_phone)+'</td><td>'+E(n.kind)+'</td><td>'+P(n.status)+'</td><td>'+E(n.attempts)+'</td><td style="max-width:420px">'+E(n.last_error||'—')+'</td><td>'+E(D(n.sent_at||n.next_attempt_at||n.dead_lettered_at))+'</td><td>'+(n.status==='dead_letter'?'<button class="danger" onclick="retry(\''+n.id+'\')">Retry</button>':'—')+'</td></tr>'));audit.innerHTML=box('Manual retry audit',['Notification','Previous attempts','Reason','By','When'],(x.audit||[]).map(a=>'<tr><td>'+E(a.notification_id)+'</td><td>'+E(a.previous_attempts)+'</td><td>'+E(a.reason||'—')+'</td><td>'+E(a.retried_by)+'</td><td>'+E(D(a.created_at))+'</td></tr>'));updated.textContent='Live data · updated '+new Date().toLocaleTimeString()}async function load(){error.style.display='none';try{render(await api({action:'summary'}))}catch(e){error.textContent=e.message;error.style.display='block'}}loginForm.onsubmit=async e=>{e.preventDefault();pw=password.value;try{await api({action:'summary'});sessionStorage.setItem('hc_admin_password',pw);loginWrap.classList.add('hidden');app.classList.remove('hidden');load()}catch(err){loginError.textContent=err.message;loginError.style.display='block'}};signout.onclick=()=>{sessionStorage.clear();location.reload()};if(pw){loginWrap.classList.add('hidden');app.classList.remove('hidden');load()}</script></body></html>
