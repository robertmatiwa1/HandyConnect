name: Conversation Regression

on:
  push:
    branches: [main]
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/conversation-transcripts/**'
      - 'tests/conversations/**'
      - '.github/workflows/conversation-regression.yml'
  pull_request:
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/conversation-transcripts/**'
      - 'tests/conversations/**'
      - '.github/workflows/conversation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run shared conversation unit tests
        run: |
          deno test \
            supabase/functions/_shared/location-input_test.ts \
            supabase/functions/_shared/service-scope_test.ts \
            supabase/functions/_shared/entry-contract_test.ts \
            supabase/functions/_shared/job-label_test.ts \
            supabase/functions/_shared/conversation_incidents_test.ts \
            supabase/functions/notification-dispatcher/text_test.ts

      - name: Validate transcript fixtures
        run: deno test --allow-read tests/conversation-transcripts/scenarios_test.ts

  ephemeral-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local

      - name: Resolve local database URL
        id: db
        shell: bash
        run: |
          DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')
          if [ -z "$DB_URL" ]; then
            echo "Could not resolve local Supabase DB_URL"
            exit 1
          fi
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Run database hardening smoke tests
        run: psql "${{ steps.db.outputs.db_url }}" -v ON_ERROR_STOP=1 -f tests/conversations/local-db-smoke.sql

      - name: Run Paystack subscription race regression
        run: psql "${{ steps.db.outputs.db_url }}" -v ON_ERROR_STOP=1 -f supabase/tests/paystack_subscription_race.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
