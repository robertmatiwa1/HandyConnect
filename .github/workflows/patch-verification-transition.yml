name: Patch provider verification transition
on:
  push:
    paths:
      - '.github/workflows/patch-verification-transition.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch onboarding completion state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/conversation-engine/index.ts')
          s=p.read_text()
          old='x.flow="ready";x.state="ready";x.context={};x.status="active";await save(s,x);const ui:Ui={type:"buttons",body:"One final step before you can receive jobs",buttons:[{id:"H_SUBMIT_ID",title:"Verify now"},{id:"MY_PROFILE",title:"Do this later"}]};'
          new='x.flow="ready";x.state="handyman_router_verification_document";x.context={};x.status="active";await save(s,x);const ui:Ui={type:"buttons",body:"One final step before you can receive jobs",buttons:[{id:"H_SUBMIT_ID",title:"Verify now"},{id:"HANDYMAN_HOME",title:"Do this later"}]};'
          if old not in s:
              raise SystemExit('expected onboarding completion block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/conversation-engine/index.ts
          git diff --cached --quiet || git commit -m "Route new providers directly into verification upload"
          git push
