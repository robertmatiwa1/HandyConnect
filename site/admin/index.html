<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Operations Control Tower</title>
<style>:root{--ink:#10221b;--muted:#657970;--green:#126b49;--bg:#f3f6f5;--line:#dfe8e4;--red:#a83232;--amber:#8a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.box,.stat{background:#fff;border:1px solid var(--line);border-radius:15px}.login .card{width:min(430px,92vw);padding:32px;box-shadow:0 18px 60px #173d2d18}.brand{font-size:24px;font-weight:850;color:var(--green)}.muted{color:var(--muted)}input{width:100%;padding:14px;border:1px solid #cbd9d3;border-radius:11px;font-size:16px}button,.linkbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.danger{color:var(--red)}button.good{color:var(--green)}button:disabled{opacity:.6;cursor:wait}.login button{width:100%;margin-top:14px;padding:14px}.top{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 24px;position:sticky;top:0;z-index:5}.top .brand{font-size:20px}.topactions{display:flex;gap:8px;flex-wrap:wrap}.wrap{max-width:1550px;margin:auto;padding:24px}.headline{display:flex;justify-content:space-between;align-items:end;gap:18px}.headline h1{margin:0}.stats,.funnel{display:grid;gap:12px;margin-top:18px}.stats{grid-template-columns:repeat(8,minmax(110px,1fr))}.funnel{grid-template-columns:repeat(5,1fr)}.stat{padding:16px}.stat.alert{border-color:#e4b95e;background:#fffaf0}.stat.bad{border-color:#e7aaaa;background:#fff8f8}.stat .n{font-size:27px;font-weight:850}.stat .l{font-size:12px;color:var(--muted)}.sectiontitle{margin:25px 0 8px;font-size:16px}.tabs{display:flex;gap:7px;margin:22px 0 12px;overflow:auto;padding-bottom:3px}.tab.active{background:var(--ink);color:#fff}.panel{display:none}.panel.active{display:block}.box{overflow:hidden;margin-bottom:14px}.boxhead{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line);gap:10px}.boxhead h2{font-size:15px;margin:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #edf2f0;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fbfcfc}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#edf4f1}.pill.matching,.pill.pending,.pill.open,.pill.Free,.pill.processing,.pill.queued{background:#fff3d6;color:#7c5200}.pill.completed,.pill.verified,.pill.approved,.pill.succeeded,.pill.sent,.pill.Pro,.pill.active{background:#e4f5ec;color:#17623f}.pill.failed,.pill.rejected,.pill.suspended,.pill.cancelled,.pill.dead_letter{background:#fde8e8;color:#8f2f2f}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 9px;font-size:12px}.error{background:#fde8e8;color:#852f2f;padding:12px;border-radius:12px;margin:15px 0;display:none}.empty{padding:30px;text-align:center;color:var(--muted)}.flow{font-family:ui-monospace,Consolas,monospace;font-size:12px}.healthline{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.healthline .pill{font-size:12px;padding:7px 10px}.note{background:#eef6f2;border:1px solid var(--line);padding:13px 15px;border-radius:12px;margin-top:14px}.small{font-size:12px}.nudge-status{display:block;margin-top:6px}.nudge-status .muted{display:block;margin-top:3px}@media(max-width:1050px){.stats{grid-template-columns:repeat(4,1fr)}.funnel{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.wrap{padding:14px}.stats,.funnel{grid-template-columns:repeat(2,1fr)}.headline{align-items:start;flex-direction:column}.top{align-items:flex-start}.topactions{justify-content:flex-end}}</style></head>
<body><section id="login" class="login"><form id="loginForm" class="card"><div class="brand">HandyConnect</div><p class="muted">Operations control tower</p><div id="loginError" class="error"></div><input id="password" type="password" placeholder="Admin password" required autofocus><button class="primary">Sign in</button></form></section>
<section id="app" class="hidden"><header class="top"><div><div class="brand">HandyConnect · Ops</div><div class="muted small">Marketplace + funnel + system health</div></div><div class="topactions"><a class="linkbtn" href="dispatch/">Dispatch</a><a class="linkbtn" href="supply/">Supply</a><a class="linkbtn" href="recovery/">Recovery</a><a class="linkbtn" href="control-center/">Control centre</a><a class="linkbtn" href="notifications/">Notification health</a><button id="signout">Sign out</button></div></header><main class="wrap"><div class="headline"><div><h1>Operations control tower</h1><div id="updated" class="muted">Loading…</div></div><button class="primary" onclick="load()">Refresh live data</button></div><div id="error" class="error"></div><section id="stats" class="stats"></section><nav class="tabs"><button class="tab active" data-p="overview">Overview</button><button class="tab" data-p="funnelHealth">Funnel Health</button><button class="tab" data-p="stalled">Stalled Users</button><button class="tab" data-p="jobs">Jobs</button><button class="tab" data-p="history">History</button><button class="tab" data-p="access">Free / Pro</button><button class="tab" data-p="handymen">Handymen</button><button class="tab" data-p="verifications">Verifications</button><button class="tab" data-p="reports">Reports</button><button class="tab" data-p="payments">Payments</button><button class="tab" data-p="notifications">Notifications</button></nav><section id="overview" class="panel active"></section><section id="funnelHealth" class="panel"></section><section id="stalled" class="panel"></section><section id="jobs" class="panel"></section><section id="history" class="panel"></section><section id="access" class="panel"></section><section id="handymen" class="panel"></section><section id="verifications" class="panel"></section><section id="reports" class="panel"></section><section id="payments" class="panel"></section><section id="notifications" class="panel"></section></main></section>
<script>
const API="https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/admin-api",GROWTH="https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/ops-growth-api";let adminPassword=sessionStorage.getItem("hc_admin_password")||"",latestGrowth=null;
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);const P=s=>'<span class="pill '+E(s)+'">'+E(String(s||"unknown").replaceAll("_"," "))+'</span>';const D=s=>s?new Date(s).toLocaleString():"—";const R=c=>"R "+((Number(c)||0)/100).toFixed(2);const AGE=s=>{if(!s)return"—";const m=Math.max(0,Math.floor((Date.now()-new Date(s).getTime())/60000));return m<60?m+" min":m<1440?Math.floor(m/60)+" hr":Math.floor(m/1440)+" d"};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.p).classList.add("active")});
async function call(url,body){const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json","x-admin-password":adminPassword},body:JSON.stringify(body)}),x=await r.json().catch(()=>({error:"Invalid server response"}));if(r.status===401)throw Error("Invalid admin password");if(!r.ok)throw Error(x.error||"Request failed");return x}const api=body=>call(API,body),growth=body=>call(GROWTH,body);
function box(title,headers,rows,extra=""){return '<div class="box"><div class="boxhead"><h2>'+E(title)+'</h2><span class="muted">'+rows.length+' shown'+extra+'</span></div>'+(rows.length?'<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+E(h)+'</th>').join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>':'<div class="empty">Nothing to show.</div>')+'</div>'}
async function act(action,data,msg){if(msg&&!confirm(msg))return;await api({action,...data});await load()}
function latestNudge(phone,g=latestGrowth){return (g?.recent_notifications||[]).find(n=>n.kind==="ops_recovery_nudge"&&n.recipient_phone===phone)||null}
function nudgeStateHtml(phone,g=latestGrowth){const n=latestNudge(phone,g);if(!n)return '<span class="muted small">Not nudged yet</span>';const label=n.status==="pending"?"queued":n.status;const when=n.sent_at||n.created_at;return '<span class="nudge-status">'+P(label)+'<span class="muted small">'+E(label==="sent"?"Sent "+D(when):label==="dead_letter"||label==="failed"?"Delivery failed · "+D(when):"Queued "+D(when))+'</span></span>'}
async function refreshNudgeStatus(id,phone){try{const g=await growth({action:"summary"});latestGrowth=g;const cell=document.getElementById("nudge-status-"+id);if(cell)cell.innerHTML=nudgeStateHtml(phone,g);const n=latestNudge(phone,g);if(n&&["pending","processing"].includes(n.status)){setTimeout(()=>refreshNudgeStatus(id,phone),2500)}}catch(e){const cell=document.getElementById("nudge-status-"+id);if(cell)cell.innerHTML='<span class="pill failed">status check failed</span>'}}
async function nudge(id,phone){if(!confirm("Send a recovery WhatsApp message to this user?"))return;const btn=document.getElementById("nudge-btn-"+id),cell=document.getElementById("nudge-status-"+id);if(btn){btn.disabled=true;btn.textContent="Queueing…"}if(cell)cell.innerHTML='<span class="pill processing">queueing</span>';try{const result=await growth({action:"nudge",session_id:id});if(cell)cell.innerHTML=result.queued?'<span class="pill queued">queued</span><span class="muted small">Waiting for WhatsApp delivery confirmation…</span>':'<span class="pill queued">already queued</span>';refreshNudgeStatus(id,phone)}catch(e){if(cell)cell.innerHTML='<span class="pill failed">failed</span><span class="muted small">'+E(e.message)+'</span>'}finally{if(btn){btn.disabled=false;btn.textContent="Nudge"}}}
async function viewDoc(id){const w=window.open("","_blank");if(!w)return alert("Pop-up blocked");w.document.write('<p style="font:16px Arial;padding:24px">Loading secure document…</p>');try{const x=await api({action:"get_verification_document",id}),u="data:"+x.mime_type+";base64,"+x.data_base64;if(x.mime_type.includes("pdf")){w.location=u;return}w.document.open();w.document.write('<style>body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}img{max-width:96vw;max-height:96vh}</style><img src="'+u+'">');w.document.close()}catch(e){w.close();alert(e.message)}}async function approve(id){if(confirm("Approve and verify this handyman?")){await api({action:"approve_verification",id});await load()}}async function reject(id){const notes=prompt("Reason for rejection:","Document unclear or invalid");if(notes!==null){await api({action:"reject_verification",id,notes});await load()}}
function stat(label,value,cls=""){return '<div class="stat '+cls+'"><div class="n">'+E(value??0)+'</div><div class="l">'+E(label)+'</div></div>'}
function render(x,g){latestGrowth=g;const s=x.stats||{},e=x.economics||{},h=g.health||{},r=g.registrations||{},en=g.entrants||{};document.getElementById("stats").innerHTML=stat("WhatsApp entrants today",en.today)+stat("Stalled users",h.stalled_total,h.stalled_total?"alert":"")+stat("New handymen today",r.handymen_today)+stat("New customers today",r.customers_today)+stat("Jobs today",r.jobs_today)+stat("Searching jobs",s.searching)+stat("Available handymen",s.available)+stat("Failed notifications 24h",h.notification_failed_24h,h.notification_failed_24h?"bad":"");
const market=[["Requested",e.requested_jobs],["Offered",e.jobs_offered],["Accepted",e.jobs_accepted],["Completed",e.jobs_completed],["Cancelled",e.jobs_cancelled]].map(a=>stat(a[0]+" this month",a[1]??0)).join("");const rates=[["Offer rate",(e.offer_rate_pct??0)+"%"],["Acceptance",(e.acceptance_rate_pct??0)+"%"],["Completion",(e.completion_rate_pct??0)+"%"],["Active Pro",e.active_pro_handymen??0],["Subscription revenue",R(e.subscription_revenue_cents)]].map(a=>stat(a[0],a[1])).join("");document.getElementById("overview").innerHTML='<h2 class="sectiontitle">Marketplace funnel</h2><div class="funnel">'+market+'</div><div class="funnel">'+rates+'</div><div class="note"><strong>Beta signal:</strong> funnel health now includes people who enter WhatsApp but never become a customer or handyman record, so failed onboarding is visible before it disappears from the marketplace totals.</div>';
const growthCards=[stat("Entrants today",en.today),stat("Entrants 7d",en.d7),stat("Entrants 30d",en.d30),stat("Handymen 7d",r.handymen_7d),stat("Customers 7d",r.customers_7d),stat("Jobs 7d",r.jobs_7d),stat("Notifications sent 24h",h.notification_sent_24h),stat("Notifications pending 24h",h.notification_pending_24h,h.notification_pending_24h?"alert":"")].join("");const stageRows=(g.dropoff_by_stage||[]).map(z=>'<tr><td class="flow">'+E(z.stage)+'</td><td><strong>'+E(z.count)+'</strong></td></tr>');document.getElementById("funnelHealth").innerHTML='<div class="stats">'+growthCards+'</div><div class="healthline">'+P(h.notification_failed_24h?"notification failures":"notifications healthy")+P(h.stalled_total?"stalls need attention":"no current stalls")+'</div>'+box("Drop-offs by stage",["Flow / state","Stalled"],stageRows);
const stallRows=(g.stalled||[]).map(z=>'<tr><td><strong>'+E(z.external_user_id)+'</strong><div class="muted">inactive '+E(AGE(z.updated_at))+'</div></td><td><div class="flow">'+E(z.flow)+'</div><div class="muted flow">'+E(z.state)+'</div></td><td>'+E(z.last_message||"—")+'<div class="muted">'+E(z.last_direction||"")+'</div></td><td>'+E(D(z.updated_at))+'</td><td><button id="nudge-btn-'+z.id+'" class="good" onclick="nudge(\''+z.id+'\',\''+E(z.external_user_id)+'\')">Nudge</button><div id="nudge-status-'+z.id+'">'+nudgeStateHtml(z.external_user_id,g)+'</div></td></tr>');document.getElementById("stalled").innerHTML=box("People who started but did not finish",["User","Stopped at","Last message","Last activity","Recovery"],stallRows)+'<div class="note">A user is shown here after 15 minutes of inactivity in an incomplete flow and only when no completed customer/handyman record exists. The recovery column now shows queued, sent or failed delivery status without refreshing the whole dashboard. Nudges never accept Terms or consent on the user’s behalf.</div>';
document.getElementById("jobs").innerHTML=box("Recent jobs",["Job","Customer","Area","Status","Created"],(x.jobs||[]).map(j=>'<tr><td><strong>'+E(j.description)+'</strong><div class="muted">'+E(j.skill||"General")+'</div></td><td>'+E(j.customer_name||"—")+'<div class="muted">'+E(j.customer_phone||"")+'</div></td><td>'+E([j.suburb,j.city].filter(Boolean).join(", "))+'</td><td>'+P(j.status)+'</td><td>'+E(D(j.created_at))+'</td></tr>'));
document.getElementById("history").innerHTML=box("Completed, cancelled & expired jobs",["Job","Customer","Handyman","Outcome","Timeline","Rating"],(x.history||[]).map(j=>'<tr><td><strong>'+E(j.description)+'</strong><div class="muted">'+E(j.service||"")+'</div></td><td>'+E(j.customer_name||"—")+'<div class="muted">'+E(j.customer_phone||"")+'</div></td><td>'+E(j.handyman_name||"—")+'<div class="muted">'+E(j.handyman_phone||"")+'</div></td><td>'+P(j.status)+'</td><td>Created '+E(D(j.created_at))+'<div class="muted">Completed '+E(D(j.completed_at))+'</div></td><td>'+E(j.rating??"—")+'</td></tr>'));
document.getElementById("access").innerHTML=box("Handyman opportunity access this month",["Handyman","Plan","Used","Remaining","Verification","Jobs"],(x.access||[]).map(a=>'<tr><td><strong>'+E(a.full_name)+'</strong><div class="muted">'+E(a.phone)+'</div></td><td>'+P(a.plan_name)+'</td><td>'+E(a.used_opportunities)+'</td><td>'+E(a.has_pro_access?"Unlimited":a.remaining_free_opportunities)+'</td><td>'+P(a.verification_status)+'</td><td>'+E(a.completed_jobs)+'</td></tr>'));
document.getElementById("handymen").innerHTML=box("Handymen",["Provider","Availability","Verification","Rating","Jobs","Actions"],(x.handymen||[]).map(a=>'<tr><td><strong>'+E(a.full_name)+'</strong><div class="muted">'+E(a.phone)+'</div></td><td>'+P(a.availability_status)+'</td><td>'+P(a.verification_status)+'</td><td>'+E(a.average_rating)+'/5</td><td>'+E(a.completed_jobs)+'</td><td>'+(a.status==="active"?'<button class="danger" onclick="act(\'suspend\',{id:\''+a.id+'\'},\'Suspend this handyman?\')">Suspend</button>':'<button onclick="act(\'activate\',{id:\''+a.id+'\'})">Activate</button>')+'</td></tr>'));
document.getElementById("verifications").innerHTML=box("Verification submissions",["Handyman","Document","Status","Submitted","Actions"],(x.verifications||[]).map(v=>'<tr><td><strong>'+E(v.handyman_name||"—")+'</strong><div class="muted">'+E(v.handyman_phone||"")+'</div></td><td>'+E(v.document_type)+'<div class="muted">'+E(v.file_name||v.mime_type||"WhatsApp media")+'</div></td><td>'+P(v.status)+'</td><td>'+E(D(v.submitted_at))+'</td><td><div class="actions"><button onclick="viewDoc(\''+v.id+'\')">View</button>'+(v.status==="pending"?'<button class="good" onclick="approve(\''+v.id+'\')">Approve</button><button class="danger" onclick="reject(\''+v.id+'\')">Reject</button>':'')+'</div></td></tr>'));
document.getElementById("reports").innerHTML=box("Open reports",["Job","Reporter","Reason","Details","Created","Actions"],(x.reports||[]).map(q=>'<tr><td>'+E(q.job_description||"—")+'</td><td>'+E(q.reporter_phone)+'</td><td>'+P(q.reason)+'</td><td>'+E(q.details||"—")+'</td><td>'+E(D(q.created_at))+'</td><td><div class="actions"><button class="good" onclick="act(\'resolve_report\',{id:\''+q.id+'\'})">Resolve</button><button onclick="act(\'dismiss_report\',{id:\''+q.id+'\'})">Dismiss</button></div></td></tr>'));
document.getElementById("payments").innerHTML=box("Recent payments",["Handyman","Purpose","Amount","Provider","Status","Created"],(x.payments||[]).map(p=>'<tr><td>'+E(p.handyman_name||"—")+'<div class="muted">'+E(p.handyman_phone||"")+'</div></td><td>'+E(p.purpose)+'</td><td>'+E(R(p.amount_cents))+'</td><td>'+E(p.provider)+'</td><td>'+P(p.status)+'</td><td>'+E(D(p.created_at))+'</td></tr>'));
document.getElementById("notifications").innerHTML=box("Notification outbox",["Recipient","Kind","Status","Attempts","Last error","Created"],(x.notifications||[]).map(n=>'<tr><td>'+E(n.recipient_phone)+'</td><td>'+E(n.kind)+'</td><td>'+P(n.status)+'</td><td>'+E(n.attempts)+'</td><td>'+E(n.last_error||"—")+'</td><td>'+E(D(n.created_at))+'</td></tr>'));document.getElementById("updated").textContent="Live data · updated "+new Date().toLocaleTimeString()}
async function load(){document.getElementById("error").style.display="none";try{const [x,g]=await Promise.all([api({action:"summary"}),growth({action:"summary"})]);render(x,g)}catch(e){const z=document.getElementById("error");z.textContent=e.message;z.style.display="block"}}
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();adminPassword=document.getElementById("password").value;try{await Promise.all([api({action:"ping"}),growth({action:"ping"})]);sessionStorage.setItem("hc_admin_password",adminPassword);login.classList.add("hidden");app.classList.remove("hidden");load()}catch(err){loginError.textContent=err.message;loginError.style.display="block"}};signout.onclick=()=>{sessionStorage.clear();location.reload()};if(adminPassword){login.classList.add("hidden");app.classList.remove("hidden");load()}
</script></body></html>
