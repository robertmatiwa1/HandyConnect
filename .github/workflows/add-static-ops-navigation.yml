name: Patch Static Ops Navigation
on:
  push:
    paths:
      - '.github/workflows/add-static-ops-navigation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Ops buttons to native GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/admin/index.html')
          s=p.read_text()
          s=s.replace('href="https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/ops-dispatch"','href="dispatch/"')
          s=s.replace('href="https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/ops-supply"','href="supply/"')
          s=s.replace('href="https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/ops-recovery"','href="recovery/"')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/admin/index.html
          if git diff --cached --quiet; then
            echo "Already patched"
          else
            git commit -m "Point Ops navigation to native admin pages"
            git push
          fi
