<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Dispatch Ops</title><style>:root{--g:#126b49;--ink:#10221b;--muted:#657970;--bg:#f3f6f5;--line:#dfe8e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800;color:var(--g)}a,button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);text-decoration:none;font-weight:700;cursor:pointer}.wrap{max-width:1500px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.box{background:#fff;border:1px solid var(--line);border-radius:14px}.card{padding:16px}.n{font-size:28px;font-weight:800}.l{color:var(--muted);font-size:12px}.box{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1200px}th,td{padding:12px;border-bottom:1px solid #edf2ef;text-align:left}th{font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4f1}.err{background:#fde8e8;color:#8b3030;padding:12px;border-radius:10px;display:none;margin-bottom:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="brand">HandyConnect · Dispatch Ops</div><div><a href="../">Main Ops</a> <a href="../supply/">Supply</a> <a href="../recovery/">Recovery</a></div></header><main class="wrap"><h1>Job dispatch control</h1><div id="err" class="err"></div><div id="stats" class="stats"></div><div class="box"><table><thead><tr><th>Job</th><th>Customer</th><th>Service / Area</th><th>Status</th><th>Dispatch</th><th>Ready providers</th><th>Matches / offers</th><th>Notifications</th><th>Alert</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const OPS='https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/ops-control-api',pw=sessionStorage.getItem('hc_admin_password')||'';if(!pw)location.href='../';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),P=s=>'<span class="pill">'+E(String(s||'unknown').replaceAll('_',' '))+'</span>',D=s=>s?new Date(s).toLocaleString():'—';async function call(){const r=await fetch(OPS,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify({action:'summary'})}),x=await r.json();if(r.status===401){sessionStorage.removeItem('hc_admin_password');location.href='../';throw Error('Session expired')}if(!r.ok)throw Error(x.error||'Failed');return x}async function load(){try{const x=(await call()).dispatch,s=document.getElementById('stats');s.innerHTML=[['Jobs',x.total],['Open / matching',x.searching],['Alerts',x.alerts],['Assigned / active',x.active],['Completed',x.completed]].map(a=>'<div class="card"><div class="n">'+E(a[1])+'</div><div class="l">'+E(a[0])+'</div></div>').join('');document.getElementById('rows').innerHTML=(x.rows||[]).map(q=>'<tr><td><strong>'+E(q.description)+'</strong></td><td>'+E(q.customer_name||'—')+'<br>'+E(q.customer_phone||'')+'</td><td>'+E(q.skill_name||'—')+'<br>'+E([q.suburb,q.city].filter(Boolean).join(', '))+'</td><td>'+P(q.status)+'</td><td>'+E(q.dispatch_state)+'</td><td><strong>'+E(q.skill_ready_candidates)+'</strong></td><td>'+E(q.match_count)+' / '+E(q.open_offers)+'</td><td>'+E(q.notifications_sent)+' sent / '+E(q.notifications_failed)+' failed</td><td>'+P(q.alert||'clear')+'</td><td>'+E(D(q.created_at))+'</td></tr>').join('')}catch(e){const z=document.getElementById('err');z.textContent=e.message;z.style.display='block'}}load();setInterval(load,30000)</script></body></html>
