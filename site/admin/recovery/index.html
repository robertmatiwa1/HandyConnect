<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Recovery Ops</title><style>:root{--g:#126b49;--ink:#10221b;--muted:#657970;--bg:#f3f6f5;--line:#dfe8e4;--red:#a83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800;color:var(--g)}a,button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);text-decoration:none;font-weight:700;cursor:pointer}.wrap{max-width:1450px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.box{background:#fff;border:1px solid var(--line);border-radius:14px}.card{padding:16px}.n{font-size:28px;font-weight:800}.l{color:var(--muted);font-size:12px}.box{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:12px;border-bottom:1px solid #edf2ef;text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4f1}.primary{background:var(--g);color:#fff;border-color:var(--g)}.danger{color:var(--red)}.actions{display:flex;gap:6px;flex-wrap:wrap}.err{background:#fde8e8;color:#8b3030;padding:12px;border-radius:10px;display:none;margin-bottom:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="brand">HandyConnect · Recovery Ops</div><div><a href="../">Main Ops</a> <a href="../dispatch/">Dispatch</a> <a href="../supply/">Supply</a></div></header><main class="wrap"><h1>Journey recovery</h1><div id="err" class="err"></div><div id="stats" class="stats"></div><div class="box"><table><thead><tr><th>User</th><th>Flow</th><th>State</th><th>Age</th><th>Nudges</th><th>Delivery</th><th>Reviewed</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const OPS='https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/ops-control-api',pw=sessionStorage.getItem('hc_admin_password')||'';if(!pw)location.href='../';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),P=s=>'<span class="pill">'+E(String(s||'unknown').replaceAll('_',' '))+'</span>',D=s=>s?new Date(s).toLocaleString():'—',AGE=s=>{if(!s)return'—';const m=Math.max(0,Math.floor((Date.now()-new Date(s).getTime())/60000));return m<60?m+' min':m<1440?Math.floor(m/60)+' hr':Math.floor(m/1440)+' d'};async function api(body){const r=await fetch(OPS,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify(body)}),x=await r.json();if(r.status===401){sessionStorage.removeItem('hc_admin_password');location.href='../';throw Error('Session expired')}if(!r.ok)throw Error(x.error||'Failed');return x}async function act(action,id,msg){if(msg&&!confirm(msg))return;try{const x=await api({action,id});alert(x.message||'Updated');load()}catch(e){alert(e.message)}}async function load(){try{const x=(await api({action:'summary'})).recovery,s=x.stats||{};document.getElementById('stats').innerHTML=[['Open stalls',s.open],['Nudged',s.nudged],['Resumed',s.resumed],['Recovery rate',(s.rate||0)+'%'],['Manual review',s.manual_review]].map(a=>'<div class="card"><div class="n">'+E(a[1])+'</div><div class="l">'+E(a[0])+'</div></div>').join('');document.getElementById('rows').innerHTML=(x.open||[]).map(q=>'<tr><td><strong>'+E(q.external_user_id)+'</strong></td><td>'+E(q.flow)+'</td><td>'+E(q.state)+'</td><td>'+E(AGE(q.stalled_since))+'</td><td>'+E(q.reminder_count)+'</td><td>'+P(q.delivery_status||'not nudged')+'</td><td>'+E(D(q.reviewed_at))+'</td><td><div class="actions"><button class="primary" onclick="act(\'recovery_nudge\',\''+q.session_id+'\',\'Send one recovery WhatsApp?\')">Nudge</button><button onclick="act(\'recovery_review\',\''+q.session_id+'\')">Reviewed</button><button class="danger" onclick="act(\'recovery_dismiss\',\''+q.session_id+'\',\'Dismiss this stall?\')">Dismiss</button></div></td></tr>').join('')}catch(e){const z=document.getElementById('err');z.textContent=e.message;z.style.display='block'}}load();setInterval(load,60000)</script></body></html>
