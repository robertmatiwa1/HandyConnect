<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Disputes</title><style>body{font-family:system-ui;margin:24px;max-width:1200px}input,select,textarea,button{padding:9px;margin:4px}textarea{width:95%;min-height:70px}.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}.muted{color:#666}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{cursor:pointer}</style></head><body><h1>Dispute cases</h1><p class="muted">Evidence-led Ops review. A reliability consequence is never automatic; Ops must explicitly choose it after a supported decision.</p><div class="row"><input id="pw" type="password" placeholder="Ops password"><input id="actor" placeholder="Reviewer name" value="ops"><button onclick="load()">Load</button><a href="../evidence/">Evidence console</a></div><div id="out"></div><script>const API='https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/dispute-admin';async function call(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw.value},body:JSON.stringify({...body,actor:actor.value||'ops'})});if(!r.ok)throw Error(await r.text());return r.json()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{const d=await call({action:'summary'});out.innerHTML='<h2>Unopened reports</h2>'+d.open_reports.filter(r=>!d.cases.some(c=>c.report_id===r.id)).map(r=>`<div class=card><b>${esc(r.reason)}</b> — ${esc(r.description)}<br><span class=muted>${esc(r.reporter_phone)} · ${esc(r.created_at)}</span><p>${esc(r.details)}</p><button onclick="openCase('${r.id}')">Open formal case</button></div>`).join('')+'<h2>Cases</h2>'+d.cases.map(c=>`<div class=card><b>${esc(c.report_reason)}</b> — ${esc(c.job_description)}<br><span class=muted>${esc(c.status)} · evidence ${c.evidence_count} · opened ${esc(c.opened_at)}</span><p>${esc(c.report_details)}</p>${c.outcome?`<p><b>Outcome:</b> ${esc(c.outcome)}<br>${esc(c.decision_reason)}</p>`:`<div class=row><select id="st_${c.id}"><option>reviewing</option><option>awaiting_information</option><option>open</option></select><input id="note_${c.id}" placeholder="Status note"><button onclick="statusCase('${c.id}')">Update status</button></div><textarea id="reason_${c.id}" placeholder="Decision reason — required"></textarea><div class=row><select id="outcome_${c.id}"><option value="report_upheld">Report upheld</option><option value="partially_upheld">Partially upheld</option><option value="report_not_upheld">Report not upheld</option><option value="inconclusive">Inconclusive</option><option value="resolved_between_parties">Resolved between parties</option></select><label><input type=checkbox id="pen_${c.id}"> Apply handyman reliability consequence (-15 for 90-day score)</label><button onclick="decide('${c.id}')">Record final decision</button></div>`}</div>`).join('')}catch(e){out.textContent='Could not load: '+e.message}}async function openCase(id){await call({action:'open',report_id:id});load()}async function statusCase(id){await call({action:'status',case_id:id,status:document.getElementById('st_'+id).value,note:document.getElementById('note_'+id).value});load()}async function decide(id){const reason=document.getElementById('reason_'+id).value.trim();if(!reason)return alert('Decision reason is required.');if(!confirm('Record this as the final dispute decision?'))return;await call({action:'decide',case_id:id,outcome:document.getElementById('outcome_'+id).value,reason,apply_handyman_consequence:document.getElementById('pen_'+id).checked});load()}</script></body></html>
