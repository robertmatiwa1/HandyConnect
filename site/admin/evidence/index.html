<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Evidence</title><style>body{font:14px Arial,sans-serif;margin:0;background:#f3f6f5;color:#10221b}header{background:#fff;border-bottom:1px solid #dfe8e4;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1400px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #dfe8e4;border-radius:14px;overflow:hidden;margin:16px 0}.head{padding:14px 16px;border-bottom:1px solid #dfe8e4;font-weight:800}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:11px 14px;border-bottom:1px solid #edf2f0;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#657970}button,input{padding:10px 12px;border:1px solid #cbd9d3;border-radius:9px;background:#fff}button{font-weight:700;cursor:pointer}.primary{background:#126b49;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #dfe8e4;border-radius:14px;padding:16px}.n{font-size:26px;font-weight:800}.muted{color:#657970}.login{max-width:420px;margin:100px auto;padding:24px;background:#fff;border-radius:14px;border:1px solid #dfe8e4}.login input{width:100%;box-sizing:border-box}.login button{width:100%;margin-top:10px}.hidden{display:none}.pill{padding:4px 8px;border-radius:999px;background:#edf4f1;font-size:11px;font-weight:700}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}</style></head><body><section id="login" class="login"><h2>HandyConnect · Evidence</h2><p class="muted">Use your Ops admin password.</p><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="signin()">Sign in</button><p id="err"></p></section><section id="app" class="hidden"><header><strong>HandyConnect · Job evidence</strong><div><button onclick="location.href='../'">Back to Ops</button> <button onclick="load()">Refresh</button></div></header><main class="wrap"><div id="stats" class="stats"></div><div class="box"><div class="head">Evidence submitted</div><div class="scroll"><table><thead><tr><th>Job</th><th>Uploader</th><th>Type</th><th>Report</th><th>Submitted</th><th>File</th></tr></thead><tbody id="evidence"></tbody></table></div></div><div class="box"><div class="head">Recent reports</div><div class="scroll"><table><thead><tr><th>Job</th><th>Reporter</th><th>Reason</th><th>Status</th><th>Created</th></tr></thead><tbody id="reports"></tbody></table></div></div></main></section><script>const API='https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/evidence-admin';let pass=sessionStorage.getItem('hc_admin_password')||'';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const D=s=>s?new Date(s).toLocaleString():'—';async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pass},body:JSON.stringify(body)}),x=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw Error(x.error||'Request failed');return x}async function signin(){pass=document.getElementById('pw').value;try{await load(true);sessionStorage.setItem('hc_admin_password',pass);login.classList.add('hidden');app.classList.remove('hidden')}catch(e){err.textContent=e.message}}async function view(id){const x=await api({action:'get',id}),w=window.open();if(!w)return alert('Pop-up blocked');const u='data:'+x.mime_type+';base64,'+x.data_base64;if(x.mime_type.includes('pdf'))w.location=u;else w.document.write('<style>body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}img{max-width:96vw;max-height:96vh}</style><img src="'+u+'">')}async function load(silent=false){const x=await api({action:'summary'}),linked=x.evidence.filter(e=>e.report_id).length,photos=x.evidence.filter(e=>e.media_type==='image').length;stats.innerHTML=[['Evidence',x.evidence.length],['Linked to reports',linked],['Photos',photos],['Reports',x.reports.length]].map(a=>'<div class="stat"><div class="n">'+a[1]+'</div><div class="muted">'+a[0]+'</div></div>').join('');evidence.innerHTML=x.evidence.map(e=>'<tr><td><strong>'+E(e.job_description)+'</strong><div class="muted">'+E(e.job_status)+'</div></td><td>'+E(e.uploader_role)+'<div class="muted">'+E(e.uploader_phone)+'</div></td><td><span class="pill">'+E(e.evidence_type.replaceAll('_',' '))+'</span></td><td>'+E(e.report_reason||'—')+'<div class="muted">'+E(e.report_status||'')+'</div></td><td>'+E(D(e.created_at))+'</td><td><button onclick="view(\''+e.id+'\')">View</button></td></tr>').join('')||'<tr><td colspan="6" class="muted">No evidence submitted yet.</td></tr>';reports.innerHTML=x.reports.map(r=>'<tr><td>'+E(r.job_description||r.job_id)+'</td><td>'+E(r.reporter_phone)+'</td><td>'+E(r.reason)+'</td><td>'+E(r.status)+'</td><td>'+E(D(r.created_at))+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">No reports.</td></tr>';if(!silent){login.classList.add('hidden');app.classList.remove('hidden')}}if(pass)load().catch(()=>{});</script></body></html>
