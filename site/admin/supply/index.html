<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Supply Ops</title><style>:root{--g:#126b49;--ink:#10221b;--muted:#657970;--bg:#f3f6f5;--line:#dfe8e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800;color:var(--g)}a,button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);text-decoration:none;font-weight:700;cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.box{background:#fff;border:1px solid var(--line);border-radius:14px}.card{padding:16px}.n{font-size:28px;font-weight:800}.l{color:var(--muted);font-size:12px}.box{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:12px;border-bottom:1px solid #edf2ef;text-align:left}th{font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4f1}.primary{background:var(--g);color:#fff;border-color:var(--g)}.err{background:#fde8e8;color:#8b3030;padding:12px;border-radius:10px;display:none;margin-bottom:12px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="brand">HandyConnect · Supply Ops</div><div><a href="../">Main Ops</a> <a href="../dispatch/">Dispatch</a> <a href="../recovery/">Recovery</a></div></header><main class="wrap"><h1>Provider readiness</h1><div id="err" class="err"></div><div id="stats" class="stats"></div><div class="box"><table><thead><tr><th>Provider</th><th>Skills</th><th>Areas</th><th>Verification</th><th>Availability</th><th>Blocker</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const OPS='https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/ops-control-api',pw=sessionStorage.getItem('hc_admin_password')||'';if(!pw)location.href='../';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),P=s=>'<span class="pill">'+E(String(s||'unknown').replaceAll('_',' '))+'</span>';async function api(body){const r=await fetch(OPS,{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},body:JSON.stringify(body)}),x=await r.json();if(r.status===401){sessionStorage.removeItem('hc_admin_password');location.href='../';throw Error('Session expired')}if(!r.ok)throw Error(x.error||'Failed');return x}async function nudge(id){if(!confirm('Send readiness WhatsApp nudge?'))return;try{const x=await api({action:'supply_nudge',id});alert(x.message||'Updated');load()}catch(e){alert(e.message)}}async function load(){try{const x=(await api({action:'summary'})).supply;document.getElementById('stats').innerHTML=[['Providers',x.total],['Dispatchable',x.ready],['Target',x.target||10],['Gap',Math.max(0,(x.target||10)-(x.ready||0))]].map(a=>'<div class="card"><div class="n">'+E(a[1])+'</div><div class="l">'+E(a[0])+'</div></div>').join('');document.getElementById('rows').innerHTML=(x.rows||[]).map(q=>'<tr><td><strong>'+E(q.full_name)+'</strong><br>'+E(q.phone)+'</td><td>'+E((q.skills||[]).join(', '))+'</td><td>'+E((q.areas||[]).join('; '))+'</td><td>'+P(q.verification_status)+'</td><td>'+P(q.availability_status)+'</td><td>'+P(q.readiness_status)+'</td><td>'+(q.dispatchable?'<span class="pill">Ready</span>':'<button class="primary" onclick="nudge(\''+q.handyman_id+'\')">Nudge</button>')+'</td></tr>').join('')}catch(e){const z=document.getElementById('err');z.textContent=e.message;z.style.display='block'}}load();setInterval(load,60000)</script></body></html>
