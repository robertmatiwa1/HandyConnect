name: Add Ops Tools Strip
on:
  push:
    paths:
      - '.github/workflows/add-ops-tools-strip.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible operations tools strip
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/admin-dashboard/index.ts')
          s=p.read_text()
          old='<div id="error" class="error"></div><div id="stats" class="stats"></div>'
          new='<div style="margin:16px 0;padding:14px 16px;background:#fff;border:1px solid var(--l);border-radius:14px"><b style="margin-right:14px">Operations tools</b><a style="margin-right:14px" href="/functions/v1/ops-dispatch">Dispatch</a><a style="margin-right:14px" href="/functions/v1/ops-supply">Supply</a><a href="/functions/v1/ops-recovery">Recovery</a></div><div id="error" class="error"></div><div id="stats" class="stats"></div>'
          if old not in s:
              raise SystemExit('marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-dashboard/index.ts
          git commit -m 'Add visible operations tools strip to Main Ops'
          git push
