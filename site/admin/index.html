<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandyConnect Operations</title><style>:root{--ink:#10221b;--muted:#657970;--green:#126b49;--bg:#f3f6f5;--line:#dfe8e4;--red:#a83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 18px 60px #173d2d18}.brand{font-size:25px;font-weight:800;color:var(--green)}.sub{color:var(--muted);margin:7px 0 24px}.login label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.login input{width:100%;padding:14px;border:1px solid #cbd9d3;border-radius:11px;font-size:16px}.login button{width:100%;margin-top:14px;background:var(--green);color:#fff;border:0;border-radius:11px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.note{font-size:12px;color:#788a82;text-align:center;margin-top:16px}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.top .brand{font-size:20px}.wrap{max-width:1480px;margin:auto;padding:24px}.headline{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.headline h1{font-size:25px;margin:0}.headline p{margin:4px 0 0;color:var(--muted)}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;color:var(--ink)}button.primary{background:var(--green);color:#fff;border-color:var(--green)}.stats{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat .n{font-size:28px;font-weight:850}.stat .l{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;margin:22px 0 12px;overflow:auto}.tab.active{background:var(--ink);color:#fff}.panel{display:none}.panel.active{display:block}.box{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.boxhead{display:flex;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}.boxhead h2{font-size:15px;margin:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #edf2f0;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fbfcfc}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#edf4f1}.pill.matching,.pill.pending,.pill.open{background:#fff3d6;color:#7c5200}.pill.completed,.pill.verified,.pill.approved,.pill.succeeded,.pill.sent{background:#e4f5ec;color:#17623f}.pill.failed,.pill.rejected,.pill.suspended{background:#fde8e8;color:#8f2f2f}.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 9px;font-size:12px}.danger{color:var(--red)}.good{color:var(--green)}.error{background:#fde8e8;color:#852f2f;padding:12px;border-radius:12px;margin-bottom:15px;display:none}.hidden{display:none!important}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:580px){.wrap{padding:14px}.top{padding:0 14px}.stats{grid-template-columns:repeat(2,1fr)}.headline{align-items:start;flex-direction:column}}</style></head><body><section id="login" class="login"><form id="loginForm" class="login-card"><div class="brand">HandyConnect</div><div class="sub">Operations dashboard</div><div id="loginError" class="error"></div><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button type="submit">Sign in</button><div class="note">Private administration area</div></form></section><section id="app" class="hidden"><header class="top"><div class="brand">HandyConnect · Ops</div><button id="signout">Sign out</button></header><main class="wrap"><div class="headline"><div><h1>Marketplace operations</h1><p id="updated">Loading live data…</p></div><button class="primary" onclick="load()">Refresh</button></div><div id="error" class="error"></div><section class="stats" id="stats"></section><nav class="tabs"><button class="tab active" data-p="jobs">Jobs</button><button class="tab" data-p="handymen">Handymen</button><button class="tab" data-p="verifications">Verifications</button><button class="tab" data-p="reports">Reports</button><button class="tab" data-p="payments">Payments</button><button class="tab" data-p="notifications">Notifications</button></nav><section id="jobs" class="panel active"></section><section id="handymen" class="panel"></section><section id="verifications" class="panel"></section><section id="reports" class="panel"></section><section id="payments" class="panel"></section><section id="notifications" class="panel"></section></main></section><script>const API='https://tjhuwtclvlxouwvktzem.supabase.co/functions/v1/admin-api';let adminPassword=sessionStorage.getItem('hc_admin_password')||'';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const P=s=>'<span class="pill '+E(s)+'">'+E(String(s||'unknown').replaceAll('_',' '))+'</span>';const D=s=>s?new Date(s).toLocaleString():'—';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});async function api(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-password':adminPassword},body:JSON.stringify(body)});const x=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401)throw Error('Invalid admin password');if(!r.ok)throw Error(x.error||'Request failed');return x}function box(title,headers,rows){return '<div class="box"><div class="boxhead"><h2>'+E(title)+'</h2><span class="muted">'+rows.length+' shown</span></div>'+(rows.length?'<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+E(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="empty">Nothing to show.</div>')+'</div>'}async function act(action,data,msg){if(msg&&!confirm(msg))return;await api({action,...data});await load()}async function viewDoc(id){try{const x=await api({action:'get_verification_document',id});const w=window.open();if(!w)throw Error('Pop-up blocked');const url='data:'+x.mime_type+';base64,'+x.data_base64;if(x.mime_type.includes('pdf'))w.location=url;else w.document.write('<title>Verification document</title><style>body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}img{max-width:96vw;max-height:96vh}</style><img src="'+url+'">')}catch(e){alert(e.message)}}async function approve(id){if(confirm('Approve this verification document and verify this handyman?')){await api({action:'approve_verification',id});await load()}}async function reject(id){const notes=prompt('Reason for rejection (shown internally):','Document unclear or invalid');if(notes===null)return;await api({action:'reject_verification',id,notes});await load()}function render(x){const s=x.stats;document.getElementById('stats').innerHTML=[['Jobs',s.jobs],['Searching',s.searching],['Active',s.active_jobs],['Handymen',s.handymen],['Available',s.available],['Verify',s.pending_verifications],['Reports',s.open_reports]].map(a=>'<div class="stat"><div class="n">'+E(a[1])+'</div><div class="l">'+E(a[0])+'</div></div>').join('');document.getElementById('jobs').innerHTML=box('Recent jobs',['Job','Customer','Area','Status','Created'],x.jobs.map(j=>'<tr><td><strong>'+E(j.description)+'</strong><div class="muted">'+E(j.skill||'General')+'</div></td><td>'+E(j.customer_name||'—')+'<div class="muted">'+E(j.customer_phone||'')+'</div></td><td>'+E([j.suburb,j.city].filter(Boolean).join(', '))+'</td><td>'+P(j.status)+'</td><td>'+E(D(j.created_at))+'</td></tr>'));document.getElementById('handymen').innerHTML=box('Handymen',['Provider','Availability','Verification','Rating','Jobs','Actions'],x.handymen.map(h=>'<tr><td><strong>'+E(h.full_name)+'</strong><div class="muted">'+E(h.phone)+'</div></td><td>'+P(h.availability_status)+'</td><td>'+P(h.verification_status)+'</td><td>'+E(h.average_rating)+'/5</td><td>'+E(h.completed_jobs)+'</td><td><div class="actions">'+(h.status==='active'?'<button class="danger" onclick="act(\'suspend\',{id:\''+h.id+'\'},\'Suspend this handyman?\')">Suspend</button>':'<button onclick="act(\'activate\',{id:\''+h.id+'\'})">Activate</button>')+'</div></td></tr>'));document.getElementById('verifications').innerHTML=box('Verification submissions',['Handyman','Document','Status','Submitted','Actions'],(x.verifications||[]).map(v=>'<tr><td><strong>'+E(v.handyman_name||'—')+'</strong><div class="muted">'+E(v.handyman_phone||'')+'</div></td><td>'+E(v.document_type)+'<div class="muted">'+E(v.file_name||v.mime_type||'WhatsApp media')+'</div></td><td>'+P(v.status)+'</td><td>'+E(D(v.submitted_at))+'</td><td><div class="actions"><button onclick="viewDoc(\''+v.id+'\')">View</button>'+(v.status==='pending'?'<button class="good" onclick="approve(\''+v.id+'\')">Approve</button><button class="danger" onclick="reject(\''+v.id+'\')">Reject</button>':'')+'</div></td></tr>'));document.getElementById('reports').innerHTML=box('Open reports',['Job','Reporter','Reason','Details','Created','Actions'],x.reports.map(r=>'<tr><td>'+E(r.job_description||'—')+'</td><td>'+E(r.reporter_phone)+'</td><td>'+P(r.reason)+'</td><td>'+E(r.details||'—')+'</td><td>'+E(D(r.created_at))+'</td><td><div class="actions"><button class="good" onclick="act(\'resolve_report\',{id:\''+r.id+'\'})">Resolve</button><button onclick="act(\'dismiss_report\',{id:\''+r.id+'\'})">Dismiss</button></div></td></tr>'));document.getElementById('payments').innerHTML=box('Recent payments',['Handyman','Purpose','Amount','Provider','Status','Created'],x.payments.map(p=>'<tr><td>'+E(p.handyman_name||'—')+'<div class="muted">'+E(p.handyman_phone||'')+'</div></td><td>'+E(p.purpose)+'</td><td>R '+E((p.amount_cents/100).toFixed(2))+'</td><td>'+E(p.provider)+'</td><td>'+P(p.status)+'</td><td>'+E(D(p.created_at))+'</td></tr>'));document.getElementById('notifications').innerHTML=box('Notification outbox',['Recipient','Kind','Status','Attempts','Last error','Created'],x.notifications.map(n=>'<tr><td>'+E(n.recipient_phone)+'</td><td>'+E(n.kind)+'</td><td>'+P(n.status)+'</td><td>'+E(n.attempts)+'</td><td>'+E(n.last_error||'—')+'</td><td>'+E(D(n.created_at))+'</td></tr>'));document.getElementById('updated').textContent='Live data · updated '+new Date().toLocaleTimeString()}async function load(){document.getElementById('error').style.display='none';try{render(await api({action:'summary'}))}catch(e){const z=document.getElementById('error');z.textContent=e.message;z.style.display='block';if(String(e.message).includes('password')){sessionStorage.removeItem('hc_admin_password');adminPassword='';document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}}}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();adminPassword=document.getElementById('password').value;try{await api({action:'ping'});sessionStorage.setItem('hc_admin_password',adminPassword);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load()}catch(err){const z=document.getElementById('loginError');z.textContent=err.message;z.style.display='block'}};document.getElementById('signout').onclick=()=>{sessionStorage.removeItem('hc_admin_password');adminPassword='';location.reload()};if(adminPassword){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load()}</script></body></html>
