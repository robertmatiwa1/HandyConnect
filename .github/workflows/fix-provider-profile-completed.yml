name: Fix provider profile completion
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-provider-profile-completed.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch conversation engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/conversation-engine/index.ts')
          s=p.read_text()
          old='update({registration_status:"active",terms_accepted_at:now,terms_version:"2026-08-11",updated_at:now})'
          new='update({registration_status:"active",profile_completed_at:now,terms_accepted_at:now,terms_version:"2026-08-11",updated_at:now})'
          if old not in s:
              raise SystemExit('target activation update not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/conversation-engine/index.ts
          git commit -m "Set provider profile completion at onboarding finish"
          git push
